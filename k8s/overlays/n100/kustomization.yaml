apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ../../services/ollama
  - ../../services/qdrant

patches:
  # Ollama: Reduced memory for N100
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "2Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"
    target:
      kind: Deployment
      name: ollama
  # Qdrant: Reduced memory for N100
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "256Mi"
    target:
      kind: Deployment
      name: qdrant
  # PVC: Reduced storage for N100
  - patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: "5Gi"
    target:
      kind: PersistentVolumeClaim
      name: ollama-data
  - patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: "3Gi"
    target:
      kind: PersistentVolumeClaim
      name: qdrant-data
