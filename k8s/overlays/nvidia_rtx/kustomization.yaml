apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ../../services/traefik
  - ../../services/ollama
  - ../../services/qdrant

patches:
  - patch: |-
      # Ollama: GPU-accelerated memory profile.
      # Rationale: GPU/CPU shared memory headroom.
      # - Requests (8Gi): Guaranteed system RAM for concurrent operations.
      # - Limits (16Gi): Maximum headroom for large vision-language models.
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "16Gi"
      - op: add
        path: /spec/template/spec/containers/0/resources/limits/nvidia.com~1gpu
        value: "1"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "8Gi"
    target:
      kind: Deployment
      name: ollama
  # Qdrant: Increased memory for high-performance vector search
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "8Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "4Gi"
    target:
      kind: Deployment
      name: qdrant
