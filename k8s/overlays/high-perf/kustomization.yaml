apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ../../services/traefik
  - ../../services/ollama
  - ../../services/qdrant

patches:
  - patch: |-
      # Ollama: High-performance memory allocation.
      # Rationale: Large model headroom.
      # - Requests (4Gi): Guaranteed RAM for active model + baseline.
      # - Limits (8Gi): Headroom for deep RAG contexts and large KV caches.
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "8Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "4Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "4"
    target:
      kind: Deployment
      name: ollama
  # Qdrant: Higher resources for fast vector search
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "4Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "2Gi"
    target:
      kind: Deployment
      name: qdrant
