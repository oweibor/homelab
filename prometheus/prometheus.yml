# Prometheus Configuration for N100 Homelab
# Scrapes metrics from Traefik, cAdvisor, node-exporter, and Ollama

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Traefik reverse proxy metrics
  - job_name: "traefik"
    static_configs:
      - targets: ["traefik:8082"]

  # Container resource metrics (CPU, memory, network per container)
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  # Host system metrics (CPU, memory, disk, network)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Ollama LLM engine metrics
  # NOTE: Ollama must be started with OLLAMA_EXPERIMENTAL_PROMETHEUS_METRICS=1
  # to expose the /metrics endpoint. Otherwise this job will fail.
  - job_name: "ollama"
    metrics_path: /metrics
    static_configs:
      - targets: ["ollama:11434"]

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Kilo Pipeline orchestration metrics
  - job_name: "kilo-pipeline"
    static_configs:
      - targets: ["kilo-pipeline:3100"]
