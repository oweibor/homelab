http:
  middlewares:
    # Global Security Headers (Top 5 OWASP recommendations)
    secure-headers:
      headers:
        # Force HTTPS for 2 years (protects against downgrade attacks)
        stsSeconds: 63072000
        stsIncludeSubdomains: true
        stsPreload: true
        # Prevent MIME-type sniffing (blocks content-type attacks)
        contentTypeNosniff: true
        # Prevent clickjacking (blocks third-party iframe embedding)
        customFrameOptionsValue: "SAMEORIGIN"
        # Control referrer leakage across origins
        referrerPolicy: "strict-origin-when-cross-origin"
        # Disable sensitive browser APIs by default
        permissionsPolicy: "camera=(), microphone=(), geolocation=(), payment=()"
        # Additional hardening
        browserXssFilter: true
        customResponseHeaders:
          X-Robots-Tag: "noindex, nofollow"

    # OnlyOffice requires relaxed frame policy and large body size
    onlyoffice-headers:
      headers:
        stsSeconds: 63072000
        stsIncludeSubdomains: true
        contentTypeNosniff: true
        browserXssFilter: true
        customFrameOptionsValue: "SAMEORIGIN"
        referrerPolicy: "strict-origin-when-cross-origin"
    
    # Nextcloud-specific headers
    nextcloud-headers:
      headers:
        stsSeconds: 63072000
        stsIncludeSubdomains: true
        contentTypeNosniff: true
        customFrameOptionsValue: "SAMEORIGIN"
        referrerPolicy: "no-referrer"
        customResponseHeaders:
          X-Robots-Tag: "noindex, nofollow"

    traefik-auth:
      basicAuth:
        users:
          # Default: admin/admin (CHANGE THIS!)
          # Generate with: echo $(htpasswd -nb admin yourpassword) | sed -e s/\\$/\\$\\$/g
          - "admin:$$apr1$$8EVjn/nj$$GiLUZqcbueTFeD23SuB6x0"
    
  routers:
    dashboard:
      rule: "Host(`traefik.homelab.local`)"
      service: api@internal
      entryPoints:
        - websecure
      middlewares:
        - secure-headers
        - traefik-auth
      tls: {}
    
    homeassistant:
      rule: "Host(`ha.homelab.local`)"
      service: homeassistant
      entryPoints:
        - websecure
      middlewares:
        - secure-headers
      tls: {}

    plex:
      rule: "Host(`plex.homelab.local`)"
      service: plex
      entryPoints:
        - websecure
      middlewares:
        - secure-headers
      tls: {}

    onlyoffice:
      rule: "Host(`office.homelab.local`)"
      service: onlyoffice
      entryPoints:
        - websecure
      middlewares:
        - onlyoffice-headers
      tls: {}

    nextcloud:
      rule: "Host(`nextcloud.homelab.local`)"
      service: nextcloud
      entryPoints:
        - websecure
      middlewares:
        - nextcloud-headers
      tls: {}

  services:
    homeassistant:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8123"
        healthCheck:
          path: /
          interval: 30s
          timeout: 5s

    plex:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:32400"
        healthCheck:
          path: /
          interval: 30s
          timeout: 5s

    onlyoffice:
      loadBalancer:
        servers:
          - url: "http://onlyoffice:80"

    nextcloud:
      loadBalancer:
        servers:
          - url: "http://nextcloud:80"

tls:
  stores:
    default:
      defaultCertificate:
        certFile: /etc/traefik/certs/homelab.local.crt
        keyFile: /etc/traefik/certs/homelab.local.key
