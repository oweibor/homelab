services:
  traefik:
    image: traefik:v3.0
    container_name: traefik
    restart: unless-stopped
    command:
      - "--configFile=/etc/traefik/traefik.yaml"
    networks:
      - homelab
      - proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik:/etc/traefik
    environment:
      - TZ=${TZ}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - docker-proxy

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    networks:
      - homelab
      - watchtower-net
    depends_on:
      - docker-proxy-watchtower
    environment:
      - DOCKER_HOST=tcp://docker-proxy-watchtower:2375
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE=0 0 3 * * SUN
      - TZ=${TZ}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    network_mode: host
    restart: unless-stopped
    privileged: true
    volumes:
      - ./homeassistant:/config
      - /run/dbus:/run/dbus:ro
    environment:
      - TZ=${TZ}
    cap_add:
      - NET_ADMIN
      - NET_RAW
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - PLEX_CLAIM=${PLEX_CLAIM}
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID}"
    volumes:
      - ./plex/config:/config
      - ./media:/data
      - ./plex/transcode:/transcode
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    networks:
      - homelab
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ollama.rule=Host(`ollama.homelab.local`)"
      - "traefik.http.routers.ollama.entrypoints=websecure"
      - "traefik.http.routers.ollama.tls=true"
      - "traefik.http.routers.ollama.middlewares=secure-headers@file"
      - "traefik.http.services.ollama.loadbalancer.server.port=11434"
    environment:
      - TZ=${TZ}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:11434/api/tags" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    networks:
      - homelab
    ports:
      - "3000:8080"
    volumes:
      - ./open-webui:/app/backend/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chat.rule=Host(`chat.homelab.local`)"
      - "traefik.http.routers.chat.entrypoints=websecure"
      - "traefik.http.routers.chat.tls=true"
      - "traefik.http.routers.chat.middlewares=secure-headers@file"
      - "traefik.http.services.chat.loadbalancer.server.port=8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - ollama

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    networks:
      - homelab
    ports:
      - "5678:5678"
    volumes:
      - ./n8n:/home/node/.n8n
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.homelab.local`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls=true"
      - "traefik.http.routers.n8n.middlewares=secure-headers@file"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASS}
      - N8N_SECURE_COOKIE=false
      - TZ=${TZ}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5678/healthz" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  samba:
    image: dperson/samba:latest
    container_name: samba
    restart: unless-stopped
    networks:
      - homelab
    ports:
      - "137-138:137-138/udp"
      - "139:139"
      - "445:445"
    environment:
      - USERID=${PUID}
      - GROUPID=${PGID}
      - TZ=${TZ}
      - USER=${SAMBA_USER};${SAMBA_PASS}
    volumes:
      - ./media:/mount/media:rw
    command: "-u \"${SAMBA_USER};${SAMBA_PASS}\" -s \"Media;/mount/media;yes;no;no;${SAMBA_USER}\""
    healthcheck:
      test: [ "CMD", "bash", "-c", "</dev/tcp/localhost/445" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # Google Antigravity Code Editor (VNC-based IDE)
  antigravity:
    image: ghcr.io/rawritude/antigravity-remote:latest
    container_name: antigravity
    restart: unless-stopped
    networks:
      - homelab
    ports:
      - "6080:6080"
      - "5900:5900"
    volumes:
      - ./antigravity/workspace:/home/devuser/workspace
      - ./antigravity/config:/home/devuser/.config
    environment:
      - VNC_PASSWORD=${ANTIGRAVITY_VNC_PASSWORD}
      - OLLAMA_HOST=http://ollama:11434
      - TZ=${TZ}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:6080" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.antigravity.rule=Host(`antigravity.homelab.local`)"
      - "traefik.http.routers.antigravity.entrypoints=websecure"
      - "traefik.http.routers.antigravity.tls=true"
      - "traefik.http.routers.antigravity.middlewares=secure-headers@file"
      - "traefik.http.services.antigravity.loadbalancer.server.port=6080"
    depends_on:
      - ollama
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Secure Docker Socket Proxy (Zero-Trust Docker API gateway)
  # Only exposes read-only container/service/network discovery.
  # Traefik and OpenClaw connect here instead of the raw Docker socket.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-proxy
    restart: unless-stopped
    networks:
      - proxy
      - homelab
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Read-only discovery for Traefik
      - CONTAINERS=1
      - SERVICES=1
      - NETWORKS=1
      - TASKS=1
      # Write access disabled (zero-trust)
      - POST=0
      - EXEC=0
      - LOGS=0
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # Dedicated Write-Proxy for Watchtower (Architectural Isolation)
  # This instance has POST and IMAGES enabled to allow automated updates.
  # Isolated on watchtower-net to prevent access from other containers.
  docker-proxy-watchtower:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-proxy-watchtower
    restart: unless-stopped
    networks:
      - watchtower-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
      - SERVICES=1
      - NETWORKS=1
      - TASKS=1
      - IMAGES=1 # ✅ Added - allows image operations
      - POST=1 # ✅ Changed - allows container updates
      - LOGS=1 # ✅ Added - useful for debugging
      - EXEC=0 # Keep disabled
      - BUILD=0 # Keep disabled
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # OpenClaw AI Agent
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw
    restart: unless-stopped
    networks:
      - homelab
      - proxy
    ports:
      - "18789:18789"
    volumes:
      - ./openclaw:/home/node/.openclaw
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_TOKEN}
      - OPENCLAW_CONFIG_PATH=/home/node/.openclaw/openclaw.json
      - HOME_ASSISTANT_TOKEN=${HOME_ASSISTANT_TOKEN}
      - DOCKER_HOST=tcp://docker-proxy:2375
      - TZ=${TZ}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:18789" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openclaw.rule=Host(`openclaw.homelab.local`)"
      - "traefik.http.routers.openclaw.entrypoints=websecure"
      - "traefik.http.routers.openclaw.tls=true"
      - "traefik.http.routers.openclaw.middlewares=secure-headers@file"
      - "traefik.http.services.openclaw.loadbalancer.server.port=18789"
    depends_on:
      - ollama
      - docker-proxy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # NETBIRD SELF-HOSTED STACK (Management + Dashboard + Signal)
  # ============================================================

  # NetBird Management: Coordination Server (with Embedded IdP)
  netbird-management:
    image: netbirdio/management:latest
    container_name: netbird-management
    restart: unless-stopped
    networks:
      - homelab
    ports:
      - "33071:443" # API / Dashboard
      - "33073:33073" # gRPC
    volumes:
      - netbird_mgmt:/var/lib/netbird
      - netbird_letsencrypt:/etc/letsencrypt
    environment:
      - NETBIRD_STORE_ENGINE=sqlite
      - NETBIRD_DATA_DIR=/var/lib/netbird
      - NETBIRD_LETSENCRYPT_DOMAIN=none
      - NETBIRD_MGMT_API_ENDPOINT=https://netbird.homelab.local:33071
      - NETBIRD_MGMT_GRPC_API_ENDPOINT=https://netbird.homelab.local:33073
      - NETBIRD_MGMT_API_PORT=443
      - NETBIRD_MGMT_GRPC_API_PORT=33073
      - NETBIRD_IDP_TYPE=self-hosted
      - TZ=${TZ}
    labels:
      - "traefik.enable=true"
      # Management API & Dashboard routing
      - "traefik.http.routers.netbird-api.rule=Host(`netbird.homelab.local`) && PathPrefix(`/api`)"
      - "traefik.http.routers.netbird-api.entrypoints=websecure"
      - "traefik.http.routers.netbird-api.tls=true"
      - "traefik.http.services.netbird-api.loadbalancer.server.port=443"
      - "traefik.http.services.netbird-api.loadbalancer.server.scheme=https"
      # gRPC routing needs distinct setup, simplified for HTTP/1.1 proxying here
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # NetBird Signal: Peer Discovery Messaging
  netbird-signal:
    image: netbirdio/signal:latest
    container_name: netbird-signal
    restart: unless-stopped
    networks:
      - homelab
    volumes:
      - netbird_signal:/var/lib/netbird
    ports:
      - "10000:80" # Signal HTTP port
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # NetBird Dashboard: Web UI
  netbird-dashboard:
    image: netbirdio/dashboard:latest
    container_name: netbird-dashboard
    restart: unless-stopped
    networks:
      - homelab
    environment:
      - NETBIRD_MGMT_API_ENDPOINT=https://netbird.homelab.local:33071
      - NETBIRD_MGMT_GRPC_API_ENDPOINT=https://netbird.homelab.local:33073
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.netbird.rule=Host(`netbird.homelab.local`)"
      - "traefik.http.routers.netbird.entrypoints=websecure"
      - "traefik.http.routers.netbird.tls=true"
      - "traefik.http.services.netbird.loadbalancer.server.port=80"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # Coturn: STUN/TURN for NAT Traversal
  coturn:
    image: coturn/coturn:latest
    container_name: coturn
    restart: unless-stopped
    network_mode: host # Best performance for STUN/TURN
    command:
      - -n
      - --log-file=stdout
      - --min-port=49152
      - --max-port=65535
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ============================================================
  # OBSERVABILITY STACK (Prometheus + Grafana + Exporters)
  # ============================================================

  # Prometheus: Metrics Collection Engine
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    networks:
      - homelab
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.retention.size=5GB"
    environment:
      - TZ=${TZ}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.homelab.local`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.tls=true"
      - "traefik.http.routers.prometheus.middlewares=secure-headers@file"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Grafana: Metrics Visualization & Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    networks:
      - homelab
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://grafana.homelab.local
      - TZ=${TZ}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.homelab.local`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.routers.grafana.middlewares=secure-headers@file"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    depends_on:
      - prometheus
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # cAdvisor: Container Resource Metrics Exporter
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    networks:
      - homelab
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # Node Exporter: Host System Metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  ollama_models:
  netbird_mgmt:
  netbird_signal:
  netbird_letsencrypt:
  prometheus_data:
  grafana_data:


networks:
  homelab:
    driver: bridge
  proxy:
    driver: bridge
    internal: true # No external access — socket proxy only
  watchtower-net:
    driver: bridge
    internal: true # Private network for Watchtower <-> Proxy isolation
